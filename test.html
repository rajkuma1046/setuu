<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Intensity Meter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      color: #4CAF50;
    }
    #light-intensity {
      font-size: 2rem;
      margin: 20px 0;
      color: #333;
    }
    #status {
      font-size: 1rem;
      color: #666;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4CAF50;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Light Intensity Meter</h1>
  <p>Click the button to measure ambient light intensity:</p>
  <div id="light-intensity">Light Intensity: -- lux</div>
  <div id="status"></div>
  <button onclick="startLightMeasurement()">Start Measuring</button>

  <script>
    function startLightMeasurement() {
      const lightIntensityDisplay = document.getElementById('light-intensity');
      const statusDisplay = document.getElementById('status');

      if ('AmbientLightSensor' in window) {
        try {
          const sensor = new AmbientLightSensor();
          sensor.addEventListener('reading', () => {
            lightIntensityDisplay.innerText = `Light Intensity: ${sensor.illuminance.toFixed(2)} lux`;
            statusDisplay.innerText = 'Ambient light sensor is active.';
          });
          sensor.addEventListener('error', (event) => {
            statusDisplay.innerText = `Sensor error: ${event.error.message}`;
          });
          sensor.start();
        } catch (error) {
          statusDisplay.innerText = `Error: ${error.message}`;
        }
      } else {
        statusDisplay.innerText = 'Ambient Light Sensor API is not supported on this device.';
      }
    }
  </script>
</body>
</html>
