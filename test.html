<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      color: #4CAF50;
    }
    #calculator {
      display: inline-block;
      margin: 20px auto;
      padding: 20px;
      border: 2px solid #4CAF50;
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    input, button {
      padding: 10px;
      margin: 10px 5px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #history {
      margin-top: 20px;
      text-align: left;
      max-width: 500px;
      margin: auto;
    }
    .training-msg {
      color: #4CAF50;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h1>Smart Calculator</h1>
  <div id="calculator">
    <input id="expression" type="text" placeholder="Enter calculation (e.g., 5+5)" />
    <button onclick="calculate()">Calculate</button>
    <p id="result">Result: --</p>
  </div>

  <div id="history">
    <h3>Calculation History</h3>
    <ul id="history-list"></ul>
  </div>

  <p class="training-msg" id="training-message"></p>

  <script>
    const history = JSON.parse(localStorage.getItem('calcHistory')) || [];
    const model = JSON.parse(localStorage.getItem('calcModel')) || {};

    // Update history in UI
    function updateHistory() {
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';
      history.forEach((entry) => {
        const li = document.createElement('li');
        li.textContent = `${entry.expression} = ${entry.result}`;
        historyList.appendChild(li);
      });
    }

    // Save calculation to history
    function saveToHistory(expression, result) {
      history.push({ expression, result });
      if (history.length > 10) history.shift(); // Keep history to 10 items max
      localStorage.setItem('calcHistory', JSON.stringify(history));
    }

    // Train the "model"
    function trainModel(expression, result) {
      if (!model[expression]) {
        model[expression] = { count: 0, result };
      }
      model[expression].count += 1;
      localStorage.setItem('calcModel', JSON.stringify(model));
      showTrainingMessage(expression);
    }

    // Show training message
    function showTrainingMessage(expression) {
      const message = document.getElementById('training-message');
      const trained = model[expression]?.count || 0;
      message.textContent = `This expression has been trained ${trained} times.`;
      setTimeout(() => (message.textContent = ''), 3000);
    }

    // Perform calculation
    function calculate() {
      const expression = document.getElementById('expression').value.trim();
      if (!expression) return alert('Please enter a valid expression!');

      // Check if the expression has been trained
      if (model[expression]) {
        document.getElementById('result').textContent = `Result: ${model[expression].result} (from training)`;
        trainModel(expression, model[expression].result);
        saveToHistory(expression, model[expression].result);
        updateHistory();
        return;
      }

      // Perform calculation dynamically
      try {
        const result = eval(expression); // Use with caution, only for trusted input
        document.getElementById('result').textContent = `Result: ${result}`;
        saveToHistory(expression, result);
        trainModel(expression, result);
        updateHistory();
      } catch (error) {
        alert('Invalid expression!');
      }
    }

    // Initialize history on page load
    updateHistory();
  </script>
</body>
</html>
