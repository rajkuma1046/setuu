<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Information</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      color: #4CAF50;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #4CAF50;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Device Information</h1>
  <p>Below is the information about your device:</p>
  <table>
    <thead>
      <tr>
        <th>Property</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody id="device-info"></tbody>
  </table>

  <script>
    function getDeviceInfo() {
      const infoTable = document.getElementById('device-info');
      const deviceData = [
        { property: 'User Agent', value: navigator.userAgent },
        { property: 'Platform', value: navigator.platform },
        { property: 'Language', value: navigator.language },
        { property: 'Online Status', value: navigator.onLine ? 'Online' : 'Offline' },
        { property: 'Screen Width', value: screen.width + ' px' },
        { property: 'Screen Height', value: screen.height + ' px' },
        { property: 'Available Width', value: screen.availWidth + ' px' },
        { property: 'Available Height', value: screen.availHeight + ' px' },
        { property: 'Color Depth', value: screen.colorDepth + ' bits' },
        { property: 'Pixel Depth', value: screen.pixelDepth + ' bits' },
        { property: 'Cookies Enabled', value: navigator.cookieEnabled ? 'Yes' : 'No' },
        { property: 'JavaScript Enabled', value: 'Yes' }, // If this script is running, JavaScript is enabled
        { property: 'Connection Type', value: navigator.connection?.effectiveType || 'Not Available' },
        { property: 'Device Memory', value: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Not Available' },
        { property: 'Hardware Concurrency', value: navigator.hardwareConcurrency || 'Not Available' }
      ];

      deviceData.forEach((data) => {
        const row = document.createElement('tr');
        const propertyCell = document.createElement('td');
        const valueCell = document.createElement('td');
        propertyCell.textContent = data.property;
        valueCell.textContent = data.value;
        row.appendChild(propertyCell);
        row.appendChild(valueCell);
        infoTable.appendChild(row);
      });
    }

    // Populate the table with device information
    getDeviceInfo();
  </script>
</body>
</html>
