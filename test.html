<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Voice Frequency Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #4CAF50;
    }
    #frequency {
      font-size: 2rem;
      margin: 20px 0;
      color: #333;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #4CAF50;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Human Voice Frequency Analyzer</h1>
  <p>Click the button to detect the frequency of human voice:</p>
  <div id="frequency">Frequency: -- Hz</div>
  <button onclick="startListening()">Start Listening</button>

  <script>
    async function startListening() {
      const frequencyDisplay = document.getElementById('frequency');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        const microphone = audioContext.createMediaStreamSource(stream);
        const fftData = new Uint8Array(analyser.frequencyBinCount);
        const sampleRate = audioContext.sampleRate;

        analyser.fftSize = 2048;
        microphone.connect(analyser);

        function getHumanVoiceFrequency() {
          analyser.getByteFrequencyData(fftData);

          const nyquist = sampleRate / 2; // Nyquist frequency
          const binSize = nyquist / fftData.length;

          let maxIndex = 0;
          let maxValue = 0;

          // Focus only on frequencies in the human voice range (85 Hz to 255 Hz)
          const minIndex = Math.floor(85 / binSize);  // Lower bound index
          const maxIndexRange = Math.floor(255 / binSize); // Upper bound index

          for (let i = minIndex; i <= maxIndexRange; i++) {
            if (fftData[i] > maxValue) {
              maxValue = fftData[i];
              maxIndex = i;
            }
          }

          const frequency = maxIndex * binSize;

          if (frequency >= 85 && frequency <= 255) {
            frequencyDisplay.innerText = `Frequency: ${frequency.toFixed(2)} Hz (Human Voice Detected)`;
          } else {
            frequencyDisplay.innerText = `Frequency: -- Hz (No Human Voice)`;
          }
        }

        setInterval(getHumanVoiceFrequency, 100); // Update frequency every 100ms
      } catch (error) {
        frequencyDisplay.innerText = 'Error: Unable to access microphone.';
        console.error(error);
      }
    }
  </script>
</body>
</html>
