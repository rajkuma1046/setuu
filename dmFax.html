<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supporting Documents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .section {
            margin: 15px;
            width: 100%; /* Full width on mobile */
            max-width: 600px; /* Restrict max width */
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
            background-color: #fff;
        }
        .label {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            font-size: 18px;
            color: #555;
        }
        img, audio, iframe {
            width: 100%;
            border-radius: 5px;
        }
        audio {
            margin-top: 10px;
        }

        /* Different background colors for each section */
        .section:nth-child(1) { background-color: #e6f7ff; } /* Light blue */
        .section:nth-child(2) { background-color: #f9f0ff; } /* Light purple */
        .section:nth-child(3) { background-color: #fef0e6; } /* Light orange */
        .section:nth-child(4) { background-color: #f0f7e6; } /* Light green */
        .section:nth-child(5) { background-color: #fff7e6; } /* Light yellow */

        /* Hover effects */
        .section:hover {
            background-color: #d3d3d3;
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* Media query for PC: 2 sections per row */
        @media (min-width: 768px) {
            .section {
                width: 45%; /* Set width for 2-column layout */
            }
        }

        /* YouTube video responsive fix */
        .section iframe {
            width: 100%;           /* Full width of the container */
            aspect-ratio: 16 / 9;  /* Maintain 16:9 aspect ratio */
            border-radius: 5px;
        }
    </style>
</head>
